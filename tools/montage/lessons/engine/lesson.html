<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0a0b0f;font-family:Inter,sans-serif;color:#fff}
#cam{position:absolute;inset:0;transform-origin:50% 45%}#root{position:absolute;inset:0}
.bg{position:absolute;inset:0;background:radial-gradient(700px 520px at 28% 18%,var(--glow) 0%,rgba(10,11,15,0) 70%),radial-gradient(600px 400px at 92% 95%,rgba(120,90,220,.18),rgba(10,11,15,0) 70%),linear-gradient(#0e0f14,#08090c)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.tag{position:absolute;left:80px;top:62px;font-weight:800;font-size:22px;letter-spacing:5px;color:var(--acc)}
.h{position:absolute;left:80px;right:80px;font-weight:900;line-height:1.02}
.chip{position:absolute;border-radius:18px;background:rgba(28,30,42,.92);border:2px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:center;padding:0 18px;font-weight:800}
.card{position:absolute;border-radius:24px;background:rgba(23,25,34,.92);border:2px solid #2b2e3c;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sub{position:absolute;left:120px;right:120px;bottom:34px;text-align:center;font-weight:800;font-size:30px;line-height:1.25;text-shadow:0 4px 16px rgba(0,0,0,.9)}
</style></head><body><div id="cam"><div id="root"></div></div>
<script src="words.js"></script><script src="script.js"></script>
<script>
const R=document.getElementById('root'),CAM=document.getElementById('cam'),P=new URLSearchParams(location.search);
const TL=(P.get('tl')||'0,5').split(',').map(Number);const ACC=SCRIPT.color||'#FF7A45';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)},pr=(t,s,d)=>ease((t-s)/d);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function el(cls,css,html){const e=document.createElement('div');if(cls)e.className=cls;if(css)Object.assign(e.style,css);if(html!==undefined)e.innerHTML=html;R.append(e);return e}
function base(){R.innerHTML='';document.documentElement.style.setProperty('--acc',ACC);document.documentElement.style.setProperty('--glow',ACC+'40');el('bg');el('grid')}
function tag(t,txt){if(!txt)return;const e=el('tag',null,txt);e.style.opacity=pr(t,0,.3)}
function fadeUp(e,t,s,d=.4,dy=24){const p=pr(t,s,d);e.style.opacity=cl((t-s)/d*1.5);e.style.transform=`translateY(${(1-p)*dy}px)`;return e}
const K={
title(t,d,L){base();tag(t,L.tag);const a=el('h',{top:'130px',fontSize:'104px'},L.title);fadeUp(a,t,.05,.5,40);
 if(L.sub){fadeUp(el('h',{top:'400px',fontSize:'30px',fontWeight:'700',color:'#9aa0b4'},L.sub),t,.5)}},
quote(t,d,L){base();tag(t,L.tag);const [a,b]=L.text.split('|');const A=el('h',{top:'200px',textAlign:'center',fontSize:(a.length>16?72:92)+'px'},a);
 const p=back((t-.05)/.45);A.style.transform=`scale(${.7+.3*cl(p,0,1.2)})`;A.style.opacity=cl(t/.2);
 if(b)fadeUp(el('h',{top:(a.length>16?320:340)+'px',textAlign:'center',fontSize:'40px',color:ACC,fontWeight:'800'},b),t,.4)},
pipeline(t,d,L){base();tag(t,L.tag||'КОНВЕЙЕР');const S=SCRIPT.steps;const hl=L.hl??-1;
 S.forEach((s,i)=>{const st=hl<0? .2+i*Math.min(.45,(d*.7)/S.length):0;if(t<st)return;const x=80+i*163,y=150;
  const on=hl===i,done=hl>i;const c=el('chip',{left:x+'px',top:y+'px',width:'150px',height:'150px',alignItems:'center',textAlign:'center',
   borderColor:on?ACC:'rgba(255,255,255,.12)',background:on?ACC+'26':'rgba(28,30,42,.92)',opacity:hl>=0&&!on&&!done?.45:1,
   transform:`scale(${hl<0?back((t-st)/.35):on?1+.06*pr(t,0,.3):1})`,boxShadow:on?`0 0 50px ${ACC}55`:'none'},
   `<div style="font-size:34px;color:${on||done?ACC:'#6b7186'};margin-bottom:8px">${String(i+1).padStart(2,'0')}</div><div style="font-size:19px">${s}</div>`);
  if(i<S.length-1&&hl<0){const a=el(null,{position:'absolute',left:(x+150)+'px',top:(y+66)+'px',width:'13px',height:'4px',background:'#3a3e50',opacity:pr(t,st+.2,.2)})}});
 if(L.title){fadeUp(el('h',{top:'360px',fontSize:'52px'},L.title),t,.15)}
 (L.items||[]).forEach((x,i)=>{const s=.5+i*Math.min(.7,(d*.6)/L.items.length);if(t<s)return;
  fadeUp(el(null,{position:'absolute',left:'80px',top:(440+i*58)+'px',fontSize:'30px',fontWeight:'700',color:'#d9dce6'},`<span style="color:${ACC};margin-right:14px">●</span>${x}`),t,s,.35,0)})},
bullets(t,d,L){base();tag(t,L.tag);fadeUp(el('h',{top:'110px',fontSize:'60px'},L.title),t,.05);
 (L.items||[]).forEach((x,i)=>{const s=.4+i*Math.min(.9,(d*.65)/L.items.length);if(t<s)return;const p=pr(t,s,.35);
  el('chip',{left:'80px',right:'80px',top:(220+i*92)+'px',height:'76px',fontSize:'30px',flexDirection:'row',alignItems:'center',justifyContent:'flex-start',gap:'18px',opacity:p,transform:`translateX(${(1-p)*-60}px)`},
   `<span style="color:${ACC};font-size:30px">✓</span>${x}`)})},
stats(t,d,L){base();tag(t,L.tag);fadeUp(el('h',{top:'110px',fontSize:'56px'},L.title),t,.05);
 (L.cards||[]).forEach((c,i)=>{const s=.4+i*.6;if(t<s)return;const x=80+i*570;const card=el('card',{left:x+'px',top:'220px',width:'540px',height:'300px'});
  const p=back((t-s)/.4);card.style.transform=`scale(${cl(p,0,1.2)})`;
  card.innerHTML=`<div style="position:absolute;left:40px;top:40px;font-size:96px;font-weight:900;color:${ACC}">${c.v}</div><div style="position:absolute;left:40px;top:170px;right:30px;font-size:28px;font-weight:700;color:#c9ccd8;line-height:1.3">${c.l}</div>`})},
prompt(t,d,L){base();tag(t,L.tag||'ЗАПРОС ДЛЯ CLAUDE');if(L.title)fadeUp(el('h',{top:'100px',fontSize:'46px'},L.title),t,.05);
 const top=L.title?175:110;const card=el('card',{left:'80px',right:'80px',top:top+'px',height:(560-top)+'px'});const p=pr(t,.1,.4);card.style.opacity=p;card.style.transform=`translateY(${(1-p)*30}px)`;
 const bar=document.createElement('div');Object.assign(bar.style,{height:'46px',borderBottom:'2px solid #262935',display:'flex',alignItems:'center',gap:'10px',padding:'0 22px'});
 ['#ff5f57','#febc2e','#28c840'].forEach(c=>{const o=document.createElement('div');Object.assign(o.style,{width:'13px',height:'13px',borderRadius:'50%',background:c});bar.append(o)});card.append(bar);
 const full=L.text||'';const cps=Math.max(25,full.length/Math.max(1,(d*.7)));const n=Math.floor(cl((t-.4)*cps,0,full.length));
 const tx=document.createElement('div');Object.assign(tx.style,{position:'absolute',left:'34px',right:'34px',top:'70px',fontSize:(full.length>260?24:28)+'px',lineHeight:'1.45',fontWeight:'600',color:'#e8e2cf',whiteSpace:'pre-wrap'});
 tx.innerHTML=full.slice(0,n).replace(/</g,'&lt;').replace(/\[([^\]]+)\]/g,`<span style="color:${ACC}">[$1]</span>`)+(n<full.length||t%.8<.4?`<span style="color:${ACC}">▌</span>`:'');card.append(tx)},
twocol(t,d,L){base();tag(t,L.tag);if(L.title)fadeUp(el('h',{top:'100px',fontSize:'52px'},L.title),t,.05);
 (L.cols||[]).forEach((c,i)=>{const s=.3+i*.5;if(t<s)return;const x=80+i*570;const card=el('card',{left:x+'px',top:'190px',width:'540px',height:'360px',borderColor:i?ACC:'#2b2e3c'});
  const p=back((t-s)/.4);card.style.transform=`scale(${cl(p,0,1.2)})`;
  card.innerHTML=`<div style="position:absolute;left:32px;top:28px;font-size:34px;font-weight:900;color:${i?ACC:'#fff'}">${c.h}</div>`+
   (c.items||[]).map((x,j)=>`<div style="position:absolute;left:32px;right:24px;top:${96+j*62}px;font-size:25px;font-weight:700;color:#d9dce6;opacity:${pr(t,s+.4+j*.35,.3)}">• ${x}</div>`).join('')})},
homework(t,d,L){base();tag(t,'ДОМАШНЕЕ ЗАДАНИЕ');const card=el('card',{left:'80px',right:'80px',top:'130px',height:'420px',borderColor:ACC});
 const p=back((t-.05)/.45);card.style.transform=`scale(${cl(p,0,1.2)})`;
 (L.items||[]).forEach((x,i)=>{const s=.5+i*.8;if(t<s)return;fadeUp(el(null,{position:'absolute',left:'130px',right:'130px',top:(180+i*90)+'px',fontSize:'34px',fontWeight:'800'},
  `<span style="display:inline-block;width:52px;height:52px;border-radius:14px;background:${ACC};color:#111;text-align:center;line-height:52px;margin-right:22px">${i+1}</span>${x}`),t,s,.35)});
 if(L.next)fadeUp(el(null,{position:'absolute',left:'130px',top:'470px',fontSize:'26px',fontWeight:'700',color:'#9aa0b4'},L.next),t,d*.5)}
};
function subs(T){if(P.get('nosub')||typeof CHUNKS==='undefined')return;const c=CHUNKS.find(c=>T>=c[0]&&T<c[1]);if(!c)return;
 const b=el('sub');const q=pr(T,c[0],.12);b.style.opacity=q;
 b.innerHTML=c[2].map(w=>`<span style="color:${T>=w[1]?(T<w[2]+.05?ACC:'#fff'):'rgba(255,255,255,.5)'}">${w[0]}</span>`).join(' ')}
function renderAt(T){let i=0;while(i<TL.length-2&&T>=TL[i+1])i++;const t=T-TL[i],d=TL[i+1]-TL[i];const L=SCRIPT.lines[Math.min(i,SCRIPT.lines.length-1)];
 (K[L.scene]||K.quote)(t,d,L);subs(T);const w=cl(1-t/.25);CAM.style.transform=`scale(${1+.02*(t/d)+.03*w*w})`}
renderAt(0);
</script></body></html>
