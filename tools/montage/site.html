<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#140c08;font-family:Inter,sans-serif;color:#F3E3C3}
#light{position:absolute;inset:0;pointer-events:none}
#page{position:absolute;left:0;top:0;width:1080px}
.nav{position:absolute;left:60px;right:60px;top:60px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:34px;letter-spacing:4px}
.nav span{font-size:26px;letter-spacing:1px;font-weight:600;opacity:.7;margin-left:36px}
.hero{position:absolute;left:60px;right:60px;top:300px}
.h1{font-weight:900;font-size:112px;line-height:.98;letter-spacing:-3px}
.h1 em{font-style:normal;color:#FFB36B}
.lead{margin-top:36px;font-size:38px;line-height:1.35;opacity:.75;max-width:760px}
.btn{display:inline-block;margin-top:50px;padding:28px 56px;border-radius:60px;background:#FFB36B;color:#1a0f0a;font-weight:900;font-size:36px}
.bean{position:absolute;width:64px;height:44px;border-radius:50%;background:radial-gradient(ellipse at 35% 35%,#8a5532,#4a2814 70%);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.bean:after{content:'';position:absolute;left:8px;right:8px;top:20px;height:5px;border-radius:3px;background:#2a160a;transform:rotate(-8deg)}
.cup{position:absolute;left:640px;top:1180px;width:330px;height:250px}
.sec{position:absolute;left:60px;right:60px}
.card{height:300px;border-radius:40px;background:linear-gradient(135deg,#2a1810,#1c110b);border:2px solid rgba(255,179,107,.25);margin-bottom:40px;padding:50px;display:flex;flex-direction:column;justify-content:flex-end}
.card b{font-size:60px;font-weight:900}.card i{font-style:normal;font-size:30px;opacity:.7;margin-top:10px}
#cur{position:absolute;width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 30px rgba(255,200,140,.9);margin:-23px 0 0 -23px}
</style></head><body>
<div id="light"></div>
<div id="beans"></div>
<div id="page">
 <div class="nav">ЗЕРНО<div><span>Меню</span><span>О нас</span><span>Адрес</span></div></div>
 <div class="hero"><div class="h1">Утро<br>начинается<br><em>с зерна</em></div>
  <div class="lead">Свежая обжарка каждый день. Тёплый свет, мягкие кресла и кофе, ради которого стоит проснуться.</div>
  <div class="btn">Заказать к столику</div></div>
 <svg class="cup" viewBox="0 0 330 250"><path d="M30 80 h230 v60 a115 105 0 0 1 -230 0z" fill="#F3E3C3"/><path d="M258 100 a40 38 0 1 1 0 76" stroke="#F3E3C3" stroke-width="18" fill="none"/><ellipse cx="145" cy="82" rx="115" ry="16" fill="#6b3b1f"/><g id="steam" stroke="#F3E3C3" stroke-width="8" fill="none" stroke-linecap="round" opacity=".5"></g></svg>
 <div class="sec" id="s2" style="top:1950px"><div style="font-size:30px;letter-spacing:6px;opacity:.6;margin-bottom:30px">МЕНЮ</div>
  <div class="card"><b>Капучино</b><i>бархатная пенка, двойной эспрессо</i></div>
  <div class="card"><b>Раф с халвой</b><i>сливки, ваниль, немного магии</i></div>
  <div class="card"><b>Флэт уайт</b><i>для тех, кто любит покрепче</i></div></div>
</div>
<div id="cur"></div>
<script>
const P=new URLSearchParams(location.search);const MODE=P.get('card')||'demo';const D=+(P.get('d')||6);const SC=+(P.get('sc')||3.6);
const B=document.getElementById('beans');const beans=[];let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
for(let i=0;i<30;i++){const e=document.createElement('div');e.className='bean';B.append(e);
 const x=rnd()*1080,y=200+rnd()*1500;beans.push({e,hx:x,hy:y,x,y,vx:0,vy:0,r:rnd()*360,vr:0,s:.7+rnd()*.7,ph:rnd()*6})}
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const ease=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
// cursor path (keyframes t,x,y)
const PATHS={demo:[[0,900,1500],[1.0,520,820],[1.8,250,560],[2.6,700,700],[3.3,560,1300],[D,540,1000]],
             demo2:[[0,200,1500],[0.8,540,900],[1.6,860,600],[D,500,800]]};
const path=PATHS[MODE];
function cur(t){for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1];if(t<=b[0]){const k=ease((t-a[0])/(b[0]-a[0]));return [a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}}const l=path[path.length-1];return [l[1],l[2]]}
let last=-1;
window.renderAt=function(t){
 const dt=last<0?1/30:Math.max(1/60,t-last);last=t;
 const [cx,cy]=cur(t);
 const scroll=MODE=='demo'?ease((t-SC)/1.6)*1350:0;
 document.getElementById('page').style.transform=`translateY(${-scroll}px)`;
 document.getElementById('light').style.background=`radial-gradient(700px 700px at ${cx}px ${cy}px, rgba(255,170,90,.38), rgba(255,140,60,.10) 45%, transparent 70%), radial-gradient(1200px 900px at 50% 0%, #2a160c, #140c08 70%)`;
 const c=document.getElementById('cur');c.style.left=cx+'px';c.style.top=cy+'px';
 beans.forEach(b=>{const hy=b.hy-scroll*.6;const dx=b.x-cx,dy=b.y-cy;const d=Math.hypot(dx,dy)+1;
  if(d<330){const f=(330-d)/330*5200;b.vx+=dx/d*f*dt;b.vy+=dy/d*f*dt;b.vr+=f*dt*.08}
  b.vx+=(b.hx-b.x)*4*dt;b.vy+=(hy+Math.sin(t*1.3+b.ph)*14-b.y)*4*dt;b.vx*=.9;b.vy*=.9;b.vr*=.92;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt*10+12*dt;
  b.e.style.transform=`translate(${b.x-32}px,${b.y-22}px) rotate(${b.r}deg) scale(${b.s})`});
 // reveal menu cards
 document.querySelectorAll('.card').forEach((e,i)=>{const p=cl((scroll-700-i*160)/300);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*80}px)`});
 const st=document.getElementById('steam');let h='';for(let k=0;k<3;k++){const x=95+k*50;let d=`M${x} 60`;for(let j=1;j<=4;j++){d+=` Q ${x+Math.sin(t*3+k+j)*16} ${60-j*14+7} ${x} ${60-j*14}`}h+=`<path d="${d}"/>`}st.innerHTML=h;
};
</script></body></html>
