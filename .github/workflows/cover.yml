name: Generate covers (kie.ai)

on:
  push:
    paths:
      - "posts/**/cover_job.json"
  workflow_dispatch:

concurrency:
  group: covers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate missing covers
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: python tools/kie_cover.py
      - name: Commit results
        run: |
          git config user.name "cover-bot"
          git config user.email "cover-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "Add generated covers"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
